# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Desenberg welcome YOU !
email: XXXXXXX@163.com
description: >- # this means to ignore newlines until "baseurl:"
  记录技术学习、项目实践和思考的个人博客；展示我的作品集和项目成果。
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://desenbergChina.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: 
github_username:  DesenbergChina

# Build settings
theme: minimal-mistakes-jekyll
plugins:
  - jekyll-feed
  - jekyll-paginate-v2

# 分页配置（jekyll-paginate-v2）
pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  sort_field: 'date'
  sort_reverse: true

# 集合配置：让 _pages 目录下的页面文件被 Jekyll 处理并输出
collections:
  pages:
    output: true
    permalink: /:path/

permalink: /:categories/:title/ # 设置文章的URL结构，默认以分类和文章标题作为链接的相对路径

# 默认配置项
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author: default
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author: default
      author_profile: true
      comments: true

# 评论系统配置

comments:

  provider: "giscus" # 指定使用Giscus作为评论系统

  giscus:

    repo: "DesenbergChina/DesenbergChina.github.io" # 你的仓库完整名称

    repo_id: "R_kgDOOqcA0A" # 你的仓库的唯一ID，在Giscus生成的配置代码中可以找到

    category: "Announcements" # 刚才在Discussions中创建的分类名称

    category_id: "DIC_kwDOOqcA0M4DE3wP" # 刚才创建的分类的唯一ID，在Giscus生成的配置代码中可以找到

    mapping: "pathname" # 页面与Discussions主题的映射规则

    input_position: "top" # 评论输入框的位置，设置在评论区列表的上方

    theme: "preferred_color_scheme" # 评论区的主题颜色，浅色模式

    lang: "zh-CN" # 评论区的显示语言，设置为简体中文

    loading: "lazy" # 评论区的懒加载模式，只有用户滚动到评论区附近时，才加载评论数据

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # 本地开发环境
  - .venv/
  - .vscode/
  - "**/*.py"
  - script/
  - docs/
