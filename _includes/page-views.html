<span class="page__meta-item page__views">
  <i class="fas fa-fw fa-eye" aria-hidden="true"></i>
  <span id="gc-pageviews">0</span> 次阅读
</span>

<script>
(function () {
  const counter = document.getElementById("gc-pageviews");

  if (!counter) {
    return;
  }

  function loadPageViews() {
    if (!window.goatcounter || !window.goatcounter.get_data) {
      setTimeout(loadPageViews, 100);
      return;
    }

    const path = window.goatcounter.get_data().p;

    fetch(
      "https://desenbergchina.goatcounter.com/counter/" +
      encodeURIComponent(path) +
      ".json"
    )
      .then(function (response) {
        if (response.status === 404) {
          return { count: "0" };
        }

        if (!response.ok) {
          throw new Error("GoatCounter request failed");
        }

        return response.json();
      })
      .then(function (data) {
        counter.textContent = data.count || "0";
      })
      .catch(function () {
        counter.textContent = "--";
      });
  }

  loadPageViews();
})();
</script>
